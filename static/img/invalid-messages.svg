<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680">
  <defs>
    <pattern id="lineGridIM" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="80" y1="0" x2="80" y2="80" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
      <line x1="0" y1="80" x2="80" y2="80" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowIMred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF5C5C" fill-opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" rx="12" fill="#0d0d0d"/>
  <rect width="960" height="680" rx="12" fill="url(#lineGridIM)"/>

  <!-- Column headers -->
  <text x="150" y="60" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="2">ATTACK</text>
  <text x="495" y="60" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="2">STOPPED BY</text>
  <text x="820" y="60" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="2">RESULT</text>

  <!-- ===== Row 1: Forged message ===== -->
  <rect x="40" y="88" width="220" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="150" y="127" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Forged Message</text>
  <text x="150" y="151" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Injected with no signatures</text>

  <rect x="370" y="88" width="250" height="92" rx="8" fill="none" stroke="#00E5E5" stroke-opacity="0.25" stroke-width="1"/>
  <text x="495" y="127" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Destination Gateway</text>
  <text x="495" y="151" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">On-chain signature check fails</text>

  <rect x="720" y="88" width="200" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="820" y="127" text-anchor="middle" fill="#FF5C5C" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">✗ Rejected</text>
  <text x="820" y="151" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Never executes</text>

  <line x1="260" y1="134" x2="366" y2="134" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>
  <line x1="620" y1="134" x2="716" y2="134" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>

  <!-- ===== Row 2: Stolen signer key ===== -->
  <rect x="40" y="232" width="220" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="150" y="271" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Stolen Signer Key</text>
  <text x="150" y="295" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Attacker holds one VIA key</text>

  <rect x="370" y="232" width="250" height="92" rx="8" fill="none" stroke="#00E5E5" stroke-opacity="0.25" stroke-width="1"/>
  <text x="495" y="266" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">VIA Layer</text>
  <text x="495" y="288" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">2-of-3 minimum signature floor</text>
  <text x="495" y="306" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">One key can't clear it</text>

  <rect x="720" y="232" width="200" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="820" y="271" text-anchor="middle" fill="#FF5C5C" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">✗ Never Relayed</text>
  <text x="820" y="295" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Signature floor not met</text>

  <line x1="260" y1="278" x2="366" y2="278" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>
  <line x1="620" y1="278" x2="716" y2="278" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>

  <!-- ===== Row 3: VIA Layer compromised ===== -->
  <rect x="40" y="376" width="220" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="150" y="415" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">VIA Layer Compromised</text>
  <text x="150" y="439" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Attacker clears the signature floor</text>

  <rect x="370" y="376" width="250" height="92" rx="8" fill="none" stroke="#00E5E5" stroke-opacity="0.25" stroke-width="1"/>
  <text x="495" y="410" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Project Layer Veto</text>
  <text x="495" y="432" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Your own signer refuses</text>
  <text x="495" y="450" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">1-of-1 here — scale to any number</text>

  <rect x="720" y="376" width="200" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="820" y="415" text-anchor="middle" fill="#FF5C5C" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">✗ Rejected</text>
  <text x="820" y="439" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">One veto kills the message</text>

  <line x1="260" y1="422" x2="366" y2="422" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>
  <line x1="620" y1="422" x2="716" y2="422" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>

  <!-- ===== Divider: not an attack ===== -->
  <line x1="40" y1="508" x2="250" y2="508" stroke="#222222" stroke-width="1"/>
  <text x="480" y="512" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="2">OTHER — NOT AN ATTACK, STOPPED THE SAME WAY</text>
  <line x1="710" y1="508" x2="920" y2="508" stroke="#222222" stroke-width="1"/>

  <!-- ===== Row 4: Source chain reorg ===== -->
  <rect x="40" y="536" width="220" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="150" y="575" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Source Chain Reorg</text>
  <text x="150" y="599" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Sent transaction disappears</text>

  <rect x="370" y="536" width="250" height="92" rx="8" fill="none" stroke="#00E5E5" stroke-opacity="0.25" stroke-width="1"/>
  <text x="495" y="575" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">VIA Layer</text>
  <text x="495" y="599" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Won't sign — waits for confirmations</text>

  <rect x="720" y="536" width="200" height="92" rx="8" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="820" y="575" text-anchor="middle" fill="#FF5C5C" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">✗ Never Relayed</text>
  <text x="820" y="599" text-anchor="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="12">Message dies with the reorg</text>

  <line x1="260" y1="582" x2="366" y2="582" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>
  <line x1="620" y1="582" x2="716" y2="582" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" marker-end="url(#arrowIMred)"/>
</svg>
